<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>開業TODO生成ツール | 事業手続きナビ</title><meta name="description" content="業種や開業形態に合わせて、最初にやることをざっくり並べられる開業TODO生成ツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/startup-todo-generator.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>開業TODO生成ツール</h1><p class="lede">業種、開業形態、取引先のタイプに応じて、最初に片づけるTODOをざっくり並べます。完璧な正解ではなく、<strong>何から手をつけるかの整理</strong>に使う前提です。</p></section><section class="card"><form id="todo-form" class="calc-form"><div class="grid-2"><label>業種<select name="businessType"><option value="freelance">フリーランス・受託業</option><option value="reuse">リユース・物販</option><option value="restaurant">飲食・店舗</option><option value="consulting">相談業・小規模法人候補</option></select></label><label>開業形態<select name="legalForm"><option value="sole">まずは個人事業主</option><option value="corp">最初から法人</option><option value="undecided">まだ迷っている</option></select></label><label>取引先はBtoBが多い？<select name="b2b"><option value="high">多い</option><option value="medium">半々</option><option value="low">少ない</option></select></label><label>X発信や営業導線も整えたい？<select name="marketing"><option value="yes">はい</option><option value="no">今は不要</option></select></label></div></form><div class="results-box"><div><p class="section-label">Generated todo</p><div id="todo-headline" class="total" style="font-size:2rem;">最初のTODO</div><p class="small">表示順は「先に詰まる場所」優先です。</p></div><div id="todo-results" class="check-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="./industry-starters.html">業種別スターター導線</a><a href="./first-30-90-days.html">開業後30日・90日でやること</a><a href="./follow-up-checker.html">開業後フォロー漏れチェック</a></div></section></main><script>const form=document.getElementById('todo-form');const headline=document.getElementById('todo-headline');const results=document.getElementById('todo-results');function makeItem(text,link){return `<article class="check-item"><input type="checkbox" /><div><strong>${text}</strong>${link?`<div class="small"><a href="${link}">関連ページを見る</a></div>`:''}</div></article>`}function render(){const type=form.businessType.value;const legal=form.legalForm.value;const b2b=form.b2b.value;const marketing=form.marketing.value;const items=[];if(legal==='undecided'){items.push(makeItem('個人事業主と法人化の判断を先に整理する','./sole-prop-vs-corporation.html'));}if(legal==='corp'){items.push(makeItem('法人設立後の届出一覧を確認する','./corporate-filing-list.html'));}else{items.push(makeItem('開業届と青色申告の流れを確認する','./solo-starter.html'));}items.push(makeItem('事業用口座・クレカ・会計ソフトの入口を分ける','./business-bank-card-accounting.html'));items.push(makeItem('見積書・請求書・領収書の型を作る','./quote-invoice-receipt-guide.html'));if(b2b!=='low'){items.push(makeItem('インボイス登録の優先度を確認する','./invoice-need-checker.html'));}if(type==='reuse'){items.push(makeItem('古物商許可が必要かどうかを確認する','./kobutsu-cases.html'));}if(type==='restaurant'){items.push(makeItem('飲食店営業許可と開業前の行政手続きを確認する','./restaurant-opening.html'));}if(type==='consulting'){items.push(makeItem('損益分岐を計算して法人化ラインも見る','./breakeven-calculator.html'));}items.push(makeItem('開業費にできるものと記録ルールを決める','./startup-expense-checklist.html'));items.push(makeItem('開業後30日・90日の流れを確認する','./first-30-90-days.html'));if(marketing==='yes'){items.push(makeItem('X発信や顧客対応導線を整える','https://x.niche-s.com/'));items.push(makeItem('顧客対応テンプレ集を確認する','../client-ops/'));}headline.textContent=`${items.length}個のTODOを生成`;results.innerHTML=items.join('');}form.addEventListener('input',render);render();</script></body></html>
