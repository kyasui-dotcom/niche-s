<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>開業費メモ整理ツール | 事業手続きナビ</title><meta name="description" content="支出の内容、事業利用割合、開業との関係から、開業費として記録候補か、按分前提か、私用寄りかをざっくり整理するツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/startup-expense-sorter.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>開業費メモ整理ツール</h1><p class="lede">支出は白黒ではなく、<strong>事業との関係</strong>、<strong>私用との混ざり具合</strong>、<strong>記録の残しやすさ</strong>で整理すると実務で扱いやすくなります。これは判断メモのたたき台です。</p></section><section class="card"><form id="expense-form" class="calc-form"><div class="grid-2"><label>支出カテゴリ<select name="category"><option value="equipment">パソコン・机・備品</option><option value="marketing">名刺・広告・Web制作</option><option value="travel">交通費・打ち合わせ</option><option value="learning">書籍・講座・リサーチ</option><option value="living">生活費に近いもの</option><option value="mixed">事業と私用が混ざるもの</option></select></label><label>事業利用割合（%）<input type="number" name="ratio" value="100" min="0" max="100" step="5" /></label><label>支払い時期<select name="timing"><option value="before">開業前の準備段階</option><option value="after">開業直後</option><option value="later">だいぶ後から買った</option></select></label><label>領収書やメモを残せる？<select name="proof"><option value="yes">残せる</option><option value="some">一部だけ残せる</option><option value="no">ほぼ残っていない</option></select></label></div></form><div class="results-box"><div><p class="section-label">分類の目安</p><div id="expense-level" class="total" style="font-size:2rem;">記録候補</div><p id="expense-note" class="small">最終判断ではなく、整理優先度の目安です。</p></div><div id="expense-details" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="./startup-expense-checklist.html">開業費にできるもの・できないもの</a><a href="./business-bank-card-accounting.html">口座・クレカ・会計ソフトの組み方</a><a href="./startup-launch-kit.html">開業スタート強化セット</a></div></section></main><script>const form=document.getElementById('expense-form');const level=document.getElementById('expense-level');const note=document.getElementById('expense-note');const details=document.getElementById('expense-details');function card(title,text){return `<article class="summary-card"><h3>${title}</h3><p>${text}</p></article>`}function render(){const category=form.category.value;const ratio=Number(form.ratio.value||0);const timing=form.timing.value;const proof=form.proof.value;let score=0;if(['equipment','marketing','travel','learning'].includes(category))score+=2;if(category==='mixed')score+=1;if(category==='living')score-=2;if(ratio>=80)score+=2;else if(ratio>=40)score+=1;else score-=1;if(timing==='before'||timing==='after')score+=1;if(proof==='yes')score+=2;else if(proof==='some')score+=1;else score-=2;let label='按分前提';let text='事業との関係はあるものの、私用混在や記録条件を整理してから扱う前提です。';if(score>=5){label='開業費の記録候補';text='事業準備との関係が説明しやすく、記録も残しやすい状態です。';}else if(score<=1){label='私用寄り / 保留';text='このまま混ぜるより、別扱いか保留メモにしたほうが安全です。';}level.textContent=label;note.textContent=text;details.innerHTML=[card('今やること',score>=5?'領収書、購入理由、使い道を一緒に残します。':'事業用途の説明や按分根拠があるかを先に確認します。'),card('記録メモ',proof==='no'?'証憑が弱いので、用途メモを残しておく価値があります。':proof==='some'?'不足分を補うメモを一緒に残します。':'証憑があるので用途メモを足せば整理しやすいです。'),card('見方',ratio<50?'私用混在が強いので、無理に全額で考えないほうが安全です。':category==='living'?'生活費寄りなので慎重に分けて見てください。':'事業準備との関係が説明できるかを中心に見てください。')].join('');}form.addEventListener('input',render);render();</script></body></html>
