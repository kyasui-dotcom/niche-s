<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>請求スケジュール整理ツール | 事業手続きナビ</title><meta name="description" content="見積送付、請求、入金期限、催促、領収書発行のタイミングをざっくり決めるための請求スケジュール整理ツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/invoice-schedule-planner.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>請求スケジュール整理ツール</h1><p class="lede">請求まわりは、書類の作り方だけでなく<strong>いつ送るか</strong>で崩れやすいです。案件開始日や支払条件から、見積・請求・催促・領収書のタイミングをざっくり整理します。</p></section><section class="card"><form id="schedule-form" class="calc-form"><div class="grid-2"><label>案件開始日<input type="date" name="startDate" /></label><label>請求の形<select name="billing"><option value="advance">着手前に請求</option><option value="delivery">納品時に請求</option><option value="monthly">月末締めで請求</option></select></label><label>支払条件<select name="terms"><option value="14">請求から14日後</option><option value="30">請求から30日後</option><option value="eom">月末締め翌月末</option></select></label><label>入金前フォロー<select name="follow"><option value="yes">催促日も出す</option><option value="no">今回は不要</option></select></label></div></form><div class="results-box"><div><p class="section-label">Schedule</p><div id="schedule-title" class="total" style="font-size:2rem;">請求スケジュール</div><p class="small">契約条件に合わせて微修正する前提のたたき台です。</p></div><div id="schedule-results" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="./quote-invoice-receipt-guide.html">見積書・請求書・領収書の作り方</a><a href="../client-ops/estimate-follow-up-template.html" target="_blank" rel="noopener noreferrer">見積送付後のフォロー例文</a><a href="./follow-up-checker.html">開業後フォロー漏れチェック</a></div></section></main><script>const form=document.getElementById('schedule-form');const title=document.getElementById('schedule-title');const results=document.getElementById('schedule-results');const fmt=d=>new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric'}).format(d);const today=new Date();form.startDate.valueAsDate=today;function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function endOfNextMonth(d){const x=new Date(d.getFullYear(),d.getMonth()+2,0);return x}function card(h,p){return `<article class="summary-card"><h3>${h}</h3><p>${p}</p></article>`}function render(){const start=form.startDate.valueAsDate||new Date();const billing=form.billing.value;const terms=form.terms.value;const needFollow=form.follow.value==='yes';let quoteDate=addDays(start,-3);let invoiceDate=start; if(billing==='delivery') invoiceDate=addDays(start,7); if(billing==='monthly') invoiceDate=new Date(start.getFullYear(),start.getMonth()+1,0); let dueDate=terms==='14'?addDays(invoiceDate,14):terms==='30'?addDays(invoiceDate,30):endOfNextMonth(invoiceDate); let reminderDate=addDays(dueDate,-3); let receiptDate=addDays(dueDate,1); title.textContent=`請求予定: ${fmt(invoiceDate)}`; const cards=[card('見積送付の目安',`${fmt(quoteDate)} ごろまでに条件を揃えると進めやすいです。`),card('請求書送付の目安',`${fmt(invoiceDate)} に請求書を送る想定です。`),card('入金期限の目安',`${fmt(dueDate)} を目安にします。`)]; if(needFollow) cards.push(card('入金前フォロー',`${fmt(reminderDate)} に未入金確認の一通を入れる想定です。`)); cards.push(card('領収書・入金確認',`${fmt(receiptDate)} 前後に入金確認と領収書発行をまとめて処理します。`)); results.innerHTML=cards.join('');}form.addEventListener('input',render);render();</script></body></html>
