    <rect x="24" y="28" width="208" height="24" rx="12" fill="#ccfbf1" />
    <rect x="24" y="72" width="156" height="18" rx="9" fill="#99f6e4" />
    <rect x="24" y="108" width="190" height="18" rx="9" fill="#a5f3fc" />
    <rect x="24" y="144" width="132" height="18" rx="9" fill="#67e8f9" />
