<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>資金繰りざっくり計画ツール | 事業手続きナビ</title><meta name="description" content="手元資金、固定費、生活費、見込み売上、入金遅れをもとに、あと何か月くらい回せるかをざっくり見る資金繰りツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/cash-runway-planner.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>資金繰りざっくり計画ツール</h1><p class="lede">売上が見込めても、入金が遅いと資金繰りは苦しくなります。手元資金、固定費、生活費、月間売上見込み、入金サイトから、ざっくり何か月回せるかを見ます。</p></section><section class="card"><form id="runway-form" class="calc-form"><div class="grid-2"><label>手元資金（円）<input type="number" name="cash" value="800000" min="0" step="10000" /></label><label>毎月の固定費（円）<input type="number" name="fixed" value="120000" min="0" step="1000" /></label><label>毎月の生活引き出し（円）<input type="number" name="draw" value="180000" min="0" step="1000" /></label><label>毎月の売上見込み（円）<input type="number" name="sales" value="350000" min="0" step="1000" /></label><label>入金サイト<select name="delay"><option value="0">ほぼ当月</option><option value="1">翌月入金</option><option value="2">2か月後入金</option></select></label><label>月内の突発支出（円）<input type="number" name="extra" value="30000" min="0" step="1000" /></label></div></form><div class="results-box"><div><p class="section-label">Runway</p><div id="runway-main" class="total" style="font-size:2rem;">0か月</div><p id="runway-note" class="small">月次のラフな目安です。実際の入出金タイミングはさらに細かく見ます。</p></div><div id="runway-results" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="./breakeven-calculator.html">損益分岐のミニ計算機</a><a href="./reserve-rate-checker.html">税金・社保の引当て目安ツール</a><a href="./startup-launch-kit.html">開業スタート強化セット</a></div></section></main><script>const form=document.getElementById('runway-form');const main=document.getElementById('runway-main');const note=document.getElementById('runway-note');const results=document.getElementById('runway-results');const yen=v=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(v));function render(){let cash=Number(form.cash.value||0);const fixed=Number(form.fixed.value||0);const draw=Number(form.draw.value||0);const sales=Number(form.sales.value||0);const delay=Number(form.delay.value||0);const extra=Number(form.extra.value||0);const monthlyOut=fixed+draw+extra;let month=0;const inflowQueue=Array(delay).fill(0);while(month<24&&cash>0){const inflow=inflowQueue.shift()||0;cash+=inflow;cash-=monthlyOut;inflowQueue.push(sales);month++;if(cash<=0)break;}main.textContent=`${month}か月`;note.textContent=month<=3?'かなり短めです。固定費圧縮か入金条件の改善を先に見たほうが安全です。':month<=6?'半年未満なら、売上だけでなく入金サイトも早めに見直す価値があります。':'ひとまず短期の運転余地はありますが、税金引当ても別で見ます。';results.innerHTML=`<article class="summary-card"><h3>毎月の持ち出し</h3><p>${yen(monthlyOut)}</p></article><article class="summary-card"><h3>見込み売上</h3><p>${yen(sales)} / 月</p></article><article class="summary-card"><h3>入金サイト</h3><p>${delay===0?'当月寄り':delay===1?'翌月入金':'2か月後入金'}</p></article><article class="summary-card"><h3>見方</h3><p>${delay>=1?'売上より入金タイミングがボトルネックになりやすい状態です。':'売上そのものと固定費の差を主に見ます。'} </p></article>`;}form.addEventListener('input',render);render();</script></body></html>
