<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>開業後フォロー漏れチェック | 事業手続きナビ</title><meta name="description" content="返信、見積後フォロー、請求、休眠顧客の再接触など、開業後の運用で抜けやすいポイントを軽く点検できるチェックツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/follow-up-checker.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>開業後フォロー漏れチェック</h1><p class="lede">開業後は、届出よりも運用漏れで失速しやすいです。初回返信、見積後フォロー、請求、休眠顧客、次回アクションの管理が抜けていないかを軽く点検します。</p></section><section class="card"><form id="followup-form" class="calc-form"><div class="check-grid"><label class="check-item"><input type="checkbox" name="risk" value="2" /> <div><strong>問い合わせ初回返信の型がない</strong><div class="small">毎回ゼロから返している</div></div></label><label class="check-item"><input type="checkbox" name="risk" value="2" /> <div><strong>見積送付後のフォローが止まりがち</strong><div class="small">送って終わりになっている</div></div></label><label class="check-item"><input type="checkbox" name="risk" value="1" /> <div><strong>請求・領収の運用がまだ曖昧</strong><div class="small">何をいつ出すか決め切れていない</div></div></label><label class="check-item"><input type="checkbox" name="risk" value="2" /> <div><strong>次回連絡日を残していない</strong><div class="small">誰にいつ再連絡するか曖昧</div></div></label><label class="check-item"><input type="checkbox" name="risk" value="1" /> <div><strong>休眠顧客の再接触ルールがない</strong><div class="small">前に接点があった相手を寝かせがち</div></div></label><label class="check-item"><input type="checkbox" name="risk" value="1" /> <div><strong>接点情報が散らばっている</strong><div class="small">名刺、メール、DMがまとまっていない</div></div></label></div></form><div class="results-box"><div class="progress-row"><strong id="risk-label">リスクは軽め</strong><span id="risk-score" class="small">0 / 9</span></div><div class="progress-bar"><div id="risk-fill" class="progress-fill"></div></div><div id="risk-actions" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="../client-ops/" target="_blank" rel="noopener noreferrer">小さな営業・顧客対応テンプレ集</a><a href="./quote-invoice-receipt-guide.html">見積書・請求書・領収書の作り方</a><a href="https://app.ichigoichie-en.com/" target="_blank" rel="noopener noreferrer">一期一会</a></div></section></main><script>const form=document.getElementById('followup-form');const label=document.getElementById('risk-label');const scoreBox=document.getElementById('risk-score');const fill=document.getElementById('risk-fill');const actions=document.getElementById('risk-actions');function card(title,text){return `<article class="summary-card"><h3>${title}</h3><p>${text}</p></article>`}function render(){const values=[...form.querySelectorAll('input:checked')].map(el=>Number(el.value));const total=values.reduce((a,b)=>a+b,0);const max=9;scoreBox.textContent=`${total} / ${max}`;fill.style.width=`${Math.min(100,total/max*100)}%`;if(total>=6){label.textContent='フォロー漏れリスクが高め';actions.innerHTML=[card('最優先','初回返信、見積後フォロー、次回連絡日の3つを先に固定します。'),card('次にやること','顧客対応テンプレ集と一期一会で運用導線を分けて整えます。'),card('関連','<a href="../client-ops/">顧客対応テンプレ集を見る</a>')].join('');}else if(total>=3){label.textContent='見直し余地あり';actions.innerHTML=[card('優先','止まりやすい1〜2点だけ先に修正します。'),card('例','請求運用か休眠顧客の再接触ルールを固定します。'),card('関連','<a href="./first-30-90-days.html">開業後30日・90日でやること</a>')].join('');}else{label.textContent='リスクは軽め';actions.innerHTML=[card('状態','最低限の運用は回り始めています。'),card('次の強化','損益分岐やリピート導線の見直しに進めます。'),card('関連','<a href="./breakeven-calculator.html">損益分岐のミニ計算機</a>')].join('');}}form.addEventListener('input',render);render();</script></body></html>
