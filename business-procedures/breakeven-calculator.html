<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>固定費と損益分岐のミニ計算機 | 事業手続きナビ</title><meta name="description" content="固定費、目標手取り、原価率、客単価から、毎月必要な売上と必要件数をざっくり計算できる小さなツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/breakeven-calculator.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>固定費と損益分岐のミニ計算機</h1><p class="lede">毎月必要な売上が見えないと、開業判断も営業判断もぶれます。固定費、目標手取り、原価率、客単価から、ざっくり必要ラインを出します。</p></section><section class="card"><form id="breakeven-form" class="calc-form"><div class="grid-2"><label>毎月の固定費（円）<input type="number" name="fixed" value="120000" min="0" step="1000" /></label><label>目標の月間手取り（円）<input type="number" name="income" value="250000" min="0" step="1000" /></label><label>原価・外注・仕入れ率（%）<input type="number" name="variable" value="20" min="0" max="95" step="1" /></label><label>平均客単価（円）<input type="number" name="order" value="50000" min="1" step="1000" /></label></div></form><div class="results-box"><div><p class="section-label">Estimated</p><div id="sales-needed" class="total">¥0</div><p class="small">毎月ざっくり必要になる売上目安です。</p></div><div id="breakeven-results" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="./sole-prop-vs-corporation.html">個人事業主と法人化の比較</a><a href="./startup-expense-checklist.html">開業費の整理</a><a href="./first-30-90-days.html">開業後30日・90日</a></div></section></main><script>const form=document.getElementById('breakeven-form');const salesNeeded=document.getElementById('sales-needed');const results=document.getElementById('breakeven-results');const yen=v=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(v));function render(){const fixed=Number(form.fixed.value||0);const income=Number(form.income.value||0);const variable=Math.min(95,Math.max(0,Number(form.variable.value||0)));const order=Math.max(1,Number(form.order.value||1));const grossRate=(100-variable)/100;const target=fixed+income;const sales=target/grossRate;const customers=Math.ceil(sales/order);salesNeeded.textContent=yen(sales);results.innerHTML=`<article class="summary-card"><h3>必要粗利</h3><p>${yen(target)}</p></article><article class="summary-card"><h3>必要件数の目安</h3><p>${customers}件 / 月</p></article><article class="summary-card"><h3>粗利率</h3><p>${Math.round(grossRate*100)}%</p></article><article class="summary-card"><h3>見方</h3><p>${customers>=10?'件数が多めなので、客単価か固定費の見直し余地があります。':'件数はそこまで多くないので、受注率と継続率の設計が重要です。'} </p></article>`;}form.addEventListener('input',render);render();</script></body></html>
