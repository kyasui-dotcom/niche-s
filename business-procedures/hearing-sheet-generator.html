<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>初回ヒアリング項目ジェネレーター | 事業手続きナビ</title><meta name="description" content="サービス種類や相手の状況に応じて、初回相談で聞きたい項目をざっくり作れるヒアリングシート生成ツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/hearing-sheet-generator.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>初回ヒアリング項目ジェネレーター</h1><p class="lede">初回相談では、話が広がりすぎるより<strong>聞く順番</strong>を決めておくほうが強いです。サービス内容や相手の状況に応じて、最初に聞くべき項目を並べます。</p></section><section class="card"><form id="hearing-form" class="calc-form"><div class="grid-2"><label>サービス種別<select name="service"><option value="creative">制作・デザイン・開発</option><option value="ops">運用支援・代行</option><option value="consulting">相談・コンサル</option><option value="store">店舗・現地対応</option></select></label><label>相手の状況<select name="stage"><option value="early">まだ要件がぼんやり</option><option value="compare">比較中</option><option value="urgent">急ぎで決めたい</option></select></label><label>相手が重視しそうなもの<select name="priority"><option value="result">成果</option><option value="budget">予算</option><option value="speed">納期</option><option value="operation">運用のしやすさ</option></select></label><label>提供の形<select name="delivery"><option value="once">単発</option><option value="monthly">継続契約</option><option value="hybrid">単発から継続</option></select></label></div></form><div class="results-box"><div><p class="section-label">Generated sheet</p><div id="hearing-title" class="total" style="font-size:2rem;">初回ヒアリング</div><p class="small">全部を聞くより、5〜7個に絞って順番を固定する前提です。</p></div><div id="hearing-results" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="../client-ops/meeting-thank-you-template.html" target="_blank" rel="noopener noreferrer">初回相談後のお礼メール例文</a><a href="./pricing-draft-builder.html">料金表たたき台ツール</a><a href="./quote-invoice-receipt-guide.html">見積書・請求書・領収書の作り方</a></div></section></main><script>const form=document.getElementById('hearing-form');const title=document.getElementById('hearing-title');const results=document.getElementById('hearing-results');function card(h,p){return `<article class="summary-card"><h3>${h}</h3><p>${p}</p></article>`}function render(){const service=form.service.value;const stage=form.stage.value;const priority=form.priority.value;const delivery=form.delivery.value;title.textContent=stage==='urgent'?'短く決める初回ヒアリング':'初回ヒアリング項目';const items=[card('現状','今どの段階で、何が一番止まっているかを先に確認します。'),card('期限','いつまでに何を決めたいか、納期や開始時期の希望を確認します.'),card('予算','予算帯が決まっているか、比較前提かを確認します。')];if(service==='creative')items.push(card('制作範囲','必要な成果物、参考例、修正回数の考え方を聞きます。'));if(service==='ops')items.push(card('運用体制','誰が何を担当し、どこで詰まっているかを確認します。'));if(service==='consulting')items.push(card('意思決定','誰が判断し、どの時点で導入可否を決めるかを聞きます。'));if(service==='store')items.push(card('現地条件','場所、営業時間、現地確認の要否などを整理します。'));if(priority==='result')items.push(card('成果指標','何が改善すれば成功と言えるかを確認します。'));if(priority==='budget')items.push(card('予算制約','上限、比較条件、価格以外で重視する点を聞きます。'));if(priority==='speed')items.push(card('最短で欲しい範囲','完璧ではなく先に必要な範囲を切り分けます。'));if(priority==='operation')items.push(card('運用負荷','納品後に誰が回すか、継続負荷を確認します。'));if(delivery!=='once')items.push(card('継続前提','単発で終えるのか、継続で見るのかを最初に合わせます。'));results.innerHTML=items.slice(0,7).join('');}form.addEventListener('input',render);render();</script></body></html>
