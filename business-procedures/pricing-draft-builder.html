<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>料金表たたき台ツール | 事業手続きナビ</title><meta name="description" content="目標手取り、固定費、原価率、月間販売数から、開業初期の料金表たたき台をざっくり作るツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/pricing-draft-builder.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>料金表たたき台ツール</h1><p class="lede">価格は感覚で決めるより、<strong>毎月必要な粗利</strong>と<strong>売れる件数</strong>から逆算したほうが崩れにくいです。最初の価格帯をざっくり作るためのツールです。</p></section><section class="card"><form id="pricing-form" class="calc-form"><div class="grid-2"><label>料金モデル<select name="model"><option value="project">案件ごとの定額</option><option value="monthly">月額契約</option><option value="session">相談・セッション単位</option></select></label><label>月間で売れそうな件数 / 枠数<input type="number" name="units" value="6" min="1" step="1" /></label><label>毎月の固定費（円）<input type="number" name="fixed" value="120000" min="0" step="1000" /></label><label>目標の月間手取り（円）<input type="number" name="income" value="250000" min="0" step="1000" /></label><label>原価・外注・仕入れ率（%）<input type="number" name="variable" value="20" min="0" max="95" step="1" /></label><label>価格を強気にしたい？<select name="positioning"><option value="normal">標準</option><option value="strong">やや強気</option><option value="light">まず売れやすさ優先</option></select></label></div></form><div class="results-box"><div><p class="section-label">Draft price</p><div id="pricing-main" class="total" style="font-size:2rem;">¥0</div><p id="pricing-note" class="small">これは価格たたき台です。成約率と提供負荷も合わせて見ます。</p></div><div id="pricing-results" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="./breakeven-calculator.html">損益分岐のミニ計算機</a><a href="./quote-invoice-receipt-guide.html">見積書・請求書・領収書の作り方</a><a href="./startup-launch-kit.html">開業スタート強化セット</a></div></section></main><script>const form=document.getElementById('pricing-form');const main=document.getElementById('pricing-main');const note=document.getElementById('pricing-note');const results=document.getElementById('pricing-results');const yen=v=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(v));function render(){const units=Math.max(1,Number(form.units.value||1));const fixed=Number(form.fixed.value||0);const income=Number(form.income.value||0);const variable=Math.min(95,Math.max(0,Number(form.variable.value||0)));const positioning=form.positioning.value;const model=form.model.value;const grossRate=(100-variable)/100;const base=((fixed+income)/grossRate)/units;const factor=positioning==='strong'?1.12:positioning==='light'?0.9:1;const recommended=base*factor;const low=recommended*0.85;const high=recommended*1.2;main.textContent=yen(recommended);note.textContent=model==='monthly'?'月額契約のたたき台です。継続率が低いなら強気にしすぎないほうが安定します。':model==='session'?'相談単価のたたき台です。準備時間が長いなら枠数を少なめで再計算します。':'案件単価のたたき台です。修正回数や範囲を条件に入れて崩れを防ぎます。';results.innerHTML=`<article class="summary-card"><h3>低めの入口価格</h3><p>${yen(low)}</p></article><article class="summary-card"><h3>標準のたたき台</h3><p>${yen(recommended)}</p></article><article class="summary-card"><h3>強めの上限案</h3><p>${yen(high)}</p></article><article class="summary-card"><h3>見方</h3><p>${units<=3?'件数が少ない前提なので、範囲と修正条件を明確にして崩れを防ぎます。':'件数がある前提なので、単価より受注率と提供時間も一緒に見直してください。'} </p></article>`;}form.addEventListener('input',render);render();</script></body></html>
