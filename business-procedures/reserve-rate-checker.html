<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>税金・社保の引当て目安ツール | 事業手続きナビ</title><meta name="description" content="売上規模や収入の安定度に応じて、税金・社会保険・突発支出のために毎月どれくらい引き当てるかの目安をざっくり出すツール。" /><meta name="robots" content="index,follow" /><link rel="canonical" href="https://niche-s.com/business-procedures/reserve-rate-checker.html" /><link rel="stylesheet" href="./styles.css" /></head><body><main class="shell"><section class="hero card"><p class="eyebrow">事業手続きナビ / ツール</p><h1>税金・社保の引当て目安ツール</h1><p class="lede">開業直後は、売上が入ると全部使えるように見えがちです。税金、社会保険、急な支出のために、<strong>毎月いくら残す前提で見るか</strong>をざっくり決めるツールです。</p></section><section class="card"><form id="reserve-form" class="calc-form"><div class="grid-2"><label>月間売上の想定（円）<input type="number" name="sales" value="400000" min="0" step="1000" /></label><label>開業形態<select name="legal"><option value="sole">個人事業主</option><option value="corp">法人</option></select></label><label>収入の安定度<select name="stability"><option value="stable">安定</option><option value="mid">波がある</option><option value="unstable">かなり波がある</option></select></label><label>生活費を事業収入に強く頼る？<select name="depend"><option value="yes">はい</option><option value="no">いいえ</option></select></label></div></form><div class="results-box"><div><p class="section-label">Reserve guide</p><div id="reserve-main" class="total" style="font-size:2rem;">0%</div><p id="reserve-note" class="small">実務判断のたたき台です。実際の税負担や保険条件は個別確認してください。</p></div><div id="reserve-results" class="summary-grid"></div></div></section><section class="card"><div class="section-head"><p class="section-label">Related</p><h2>関連ページ</h2></div><div class="snapshot-links"><a href="./breakeven-calculator.html">損益分岐のミニ計算機</a><a href="./business-bank-card-accounting.html">口座・クレカ・会計の組み方</a><a href="./sole-prop-vs-corporation.html">個人事業主と法人化の比較</a></div></section></main><script>const form=document.getElementById('reserve-form');const main=document.getElementById('reserve-main');const note=document.getElementById('reserve-note');const results=document.getElementById('reserve-results');const yen=v=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(v));function render(){const sales=Number(form.sales.value||0);const legal=form.legal.value;const stability=form.stability.value;const depend=form.depend.value;let rate=0.2;if(legal==='sole')rate+=0.05;if(stability==='mid')rate+=0.05;if(stability==='unstable')rate+=0.1;if(depend==='yes')rate+=0.05;rate=Math.min(0.45,rate);main.textContent=`${Math.round(rate*100)}%`;note.textContent=`月次売上のうち ${yen(sales*rate)} を先に残す前提で見ると崩れにくくなります。`;results.innerHTML=`<article class="summary-card"><h3>毎月の引当て目安</h3><p>${yen(sales*rate)}</p></article><article class="summary-card"><h3>見方</h3><p>${rate>=0.35?'波が大きいので、厚めに残す前提が安全です。':'極端に厚くしすぎず、月次で見直す運用が現実的です。'} </p></article><article class="summary-card"><h3>分け方の例</h3><p>税金・社保・予備費でざっくり3つに分けると扱いやすいです。</p></article><article class="summary-card"><h3>次の一歩</h3><p>事業用口座とは別に、引当て用の置き場を先に決めておきます。</p></article>`;}form.addEventListener('input',render);render();</script></body></html>
